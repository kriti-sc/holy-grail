name: holy-grail

services:
  # Local S3 semantics. Not a stand-in for S3's latency — that is injected in the
  # client (src/store/latency.rs), because MinIO answers in about a millisecond
  # and every number in this prototype depends on that not being the case.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the warehouse bucket, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin password &&
      mc mb --ignore-existing local/warehouse &&
      echo 'bucket ready'
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      # File-backed, not the default in-memory SQLite. With :memory: each JDBC
      # connection gets its own empty database, so concurrent catalog calls hit
      # "no such table: iceberg_tables" — which looks like a bug in the engine
      # and is not one.
      CATALOG_URI: jdbc:sqlite:file:/tmp/catalog.db
      CATALOG_JDBC_INITIALIZE__CATALOG__TABLES: "true"
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config?warehouse=s3://warehouse/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  minio-data:
