[package]
name = "holy-grail"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = "57"
async-trait = "0.1.89"
bytes = "1.12.1"
crc32fast = "1.5.0"
crossbeam-skiplist = "0.1.3"
futures = "0.3.32"
iceberg = "0.8.0"
iceberg-catalog-rest = "0.8.0"
object_store = { version = "0.12", features = ["aws"] }
parquet = { version = "57", features = ["async", "object_store"] }
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.5", features = ["v5"] }

[dev-dependencies]
tempfile = "3.27.0"
